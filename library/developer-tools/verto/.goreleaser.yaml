version: 2
project_name: verto-pp-cli
changelog:
  disable: true
builds:
  - id: verto-pp-cli
    main: ./cmd/verto-pp-cli
    binary: verto-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/mvanhorn/printing-press-library/library/developer-tools/verto/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: verto-pp-mcp
    main: ./cmd/verto-pp-mcp
    binary: verto-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: verto-pp-cli
    repository:
      owner: aborruso
      name: homebrew-tap
    homepage: "https://github.com/mvanhorn/printing-press-library"
    description: "Official IGM coordinate transforms between every Italian reference system, from the command line"
    install: |
      bin.install "verto-pp-cli"
      bin.install "verto-pp-mcp"
